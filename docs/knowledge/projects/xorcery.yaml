description: >
  Xorcery is a Java framework for building reactive, event-sourced microservices.
  Built on HK2 dependency injection, RxJava, and YAML-based configuration.
  Provides an extension model, built-in observability, and first-class support
  for event sourcing and CQRS patterns.

key_concepts:
  - Extension model — composable, pluggable architecture via HK2
  - YAML-first configuration — hierarchical, environment-aware
  - Reactive streams — RxJava throughout, non-blocking I/O
  - Event sourcing — immutable event log, projections
  - OpenTelemetry — built-in tracing and metrics

relationship_to_messi: >
  Xorcery's reactive streaming model underpins the Messi messaging abstraction.
  Messi providers (S3, Kinesis, SQS, GCS, RabbitMQ) can be wired into
  Xorcery-based services as first-class extensions.

