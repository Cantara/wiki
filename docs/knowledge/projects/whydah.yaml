project:
  title: Whydah
  tagline: Open source IAM/SSO platform — OAuth2, OpenID Connect, LDAP
  repo: https://github.com/Cantara/Whydah
  topics: [cloud-native, iam, microservices, oauth2, sso, useradmin]
  language: Java / JavaScript
  status: maintained

description: >
  Whydah is a full-featured open source Identity and Access Management (IAM)
  platform providing Single Sign-On (SSO), OAuth2, OpenID Connect, and LDAP
  integration. Built as a set of loosely coupled microservices.

architecture:
  components:
    SecurityTokenService: Token issuance and validation
    UserIdentityBackend: LDAP-backed user store
    UserAdminService: User and role management API
    UserAdminWebApp: Web UI for administration
    SSOLoginWebApp: Login portal
    SPAProxyService: SPA/OAuth2 proxy
    OAuth2Service: OAuth2 / OIDC bridge
    HelidonProvider: Helidon-based service extensions
  deployment: Docker / docker-compose
  persistence: LDAP (UIB), embedded HSQLDB / external RDBMS

